# ── ResourceQuota & LimitRange ────────────────────────────────────────────────
# ResourceQuota — caps total resource consumption for the entire namespace.
# LimitRange    — sets default requests/limits per container so pods without
#                 explicit resources still get sensible defaults.
#
# Apply:  kubectl apply -f 13-resourcequota.yaml
# Check:  kubectl describe resourcequota -n sani-lite
#         kubectl describe limitrange -n sani-lite

apiVersion: v1
kind: ResourceQuota
metadata:
  name: sani-lite-quota
  namespace: sani-lite
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sani-lite-limits
  namespace: sani-lite
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
