# ══════════════════════════════════════════════════════════════════════════════
# STEP 11 — ExternalSecret (AWS Secrets Manager)
# ══════════════════════════════════════════════════════════════════════════════
# ExternalSecret syncs secrets from AWS Secrets Manager into Kubernetes Secrets.
# This is the PRODUCTION replacement for the manual base64 Secret in Step 6.
#
# Why not just use Kubernetes Secrets?
#   - K8s Secrets are base64 encoded, not encrypted at rest (by default)
#   - Anyone with kubectl access can decode them
#   - No audit trail, no rotation, no central management
#
# With ExternalSecret + AWS Secrets Manager:
#   ✔ Secrets are encrypted at rest in AWS
#   ✔ Full audit trail in CloudTrail
#   ✔ Automatic rotation support
#   ✔ One source of truth — update in AWS, K8s Secret updates automatically
#
# How it works:
#   1. ESO reads the ExternalSecret resource
#   2. ESO calls AWS Secrets Manager using the app-sa IRSA credentials
#   3. ESO creates/updates a Kubernetes Secret with the fetched values
#   4. The pod reads the K8s Secret as normal
#
# Prerequisites — install ESO once:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#     -n external-secrets --create-namespace --wait
#
# Apply:   kubectl apply -f 12-externalsecret.yaml
# Check:   kubectl get externalsecret -n sani-lite
#          kubectl get secret app-secrets -n sani-lite
#
# Access:  http://<NODE_PUBLIC_IP>:30300
# Cleanup: kubectl delete -f 12-externalsecret.yaml
# ══════════════════════════════════════════════════════════════════════════════

# ── ClusterSecretStore ────────────────────────────────────────────────────────
# Tells ESO HOW to connect to AWS Secrets Manager.
# Uses the app-sa ServiceAccount (IRSA) for authentication — no static credentials.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: app-sa
            namespace: sani-lite
---
# ── ExternalSecret ────────────────────────────────────────────────────────────
# Tells ESO WHAT to fetch and WHERE to put it.
# This creates a K8s Secret named "app-secrets" in the sani-lite namespace.
# refreshInterval: 1h → ESO re-syncs from AWS every hour
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: sani-lite
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: sani-lite-cluster-dev/sani-lite
        property: database_url
    - secretKey: JWT_SECRET
      remoteRef:
        key: sani-lite-cluster-dev/sani-lite
        property: jwt_secret
---
# ── MySQL Deployment ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: sani-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpassword
            - name: MYSQL_DATABASE
              value: sani
            - name: MYSQL_USER
              value: sani
            - name: MYSQL_PASSWORD
              value: sanipassword
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-u", "sani", "-psanipassword"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
# ── MySQL Service ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: sani-lite
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
# ── App Deployment (secrets from ExternalSecret) ──────────────────────────────
# The pod still reads from a K8s Secret named "app-secrets" —
# the difference is that Secret is now created and managed by ESO, not manually.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sani-app
  namespace: sani-lite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sani-app
  template:
    metadata:
      labels:
        app: sani-app
    spec:
      serviceAccountName: app-sa
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "Waiting for MySQL...";
                sleep 3;
              done
      containers:
        - name: sani-app
          image: 211125430491.dkr.ecr.us-east-1.amazonaws.com/sani-lite:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PORT
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
---
# ── App Service (NodePort) ────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sani-app
  namespace: sani-lite
spec:
  type: NodePort
  selector:
    app: sani-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
