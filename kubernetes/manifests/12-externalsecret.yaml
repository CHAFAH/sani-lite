# ── ExternalSecret ────────────────────────────────────────────────────────────
# External Secrets Operator (ESO) syncs secrets from AWS Secrets Manager
# into Kubernetes Secrets automatically.
# This replaces the manual base64 Secret in 07-secret.yaml for production.
#
# Prerequisites:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#     -n external-secrets --create-namespace --wait
#
# Apply:  kubectl apply -f 12-externalsecret.yaml
# Check:  kubectl get externalsecret -n sani-lite
#         kubectl get secret app-secrets -n sani-lite

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: app-sa
            namespace: sani-lite
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: sani-lite
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: sani-lite-cluster-dev/sani-lite
        property: database_url
    - secretKey: JWT_SECRET
      remoteRef:
        key: sani-lite-cluster-dev/sani-lite
        property: jwt_secret
