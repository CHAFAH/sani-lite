# ══════════════════════════════════════════════════════════════════════════════
# STEP 10 — HorizontalPodAutoscaler (HPA)
# ══════════════════════════════════════════════════════════════════════════════
# HPA automatically SCALES the number of pod replicas up or down
# based on observed CPU or memory usage.
#
# Prerequisites:
#   - Metrics Server must be installed in the cluster
#   - Pods MUST have resource requests defined (HPA reads from requests, not limits)
#
# Install Metrics Server (run once):
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# How it works:
#   HPA polls Metrics Server every 15s
#   If avg CPU > 70% → scale UP (add pods, up to maxReplicas)
#   If avg CPU < 70% → scale DOWN (remove pods, down to minReplicas, after 5 min cooldown)
#
# Apply:   kubectl apply -f 11-hpa.yaml
# Check:   kubectl get hpa -n sani-lite
# Watch:   kubectl get hpa sani-app -n sani-lite --watch
#
# Demo — simulate load to trigger scale-up:
#   kubectl run load --image=busybox --rm -it -n sani-lite -- \
#     sh -c "while true; do wget -qO- http://sani-app:3000; done"
#
#   Watch in another terminal:
#   kubectl get hpa sani-app -n sani-lite --watch
#   kubectl get pods -n sani-lite --watch
#
# Access:  http://<NODE_PUBLIC_IP>:30300
# Cleanup: kubectl delete -f 11-hpa.yaml
# ══════════════════════════════════════════════════════════════════════════════

# ── MySQL Deployment ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: sani-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpassword
            - name: MYSQL_DATABASE
              value: sani
            - name: MYSQL_USER
              value: sani
            - name: MYSQL_PASSWORD
              value: sanipassword
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-u", "sani", "-psanipassword"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
# ── MySQL Service ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: sani-lite
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
# ── App Deployment ────────────────────────────────────────────────────────────
# IMPORTANT: resource requests are REQUIRED for HPA to work.
# HPA calculates utilisation as: (current usage / requests.cpu) * 100
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sani-app
  namespace: sani-lite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sani-app
  template:
    metadata:
      labels:
        app: sani-app
    spec:
      serviceAccountName: app-sa
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "Waiting for MySQL...";
                sleep 3;
              done
      containers:
        - name: sani-app
          image: 075120018043.dkr.ecr.us-east-1.amazonaws.com/sani-lite:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PORT
          # resource requests are MANDATORY for HPA
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
---
# ── App Service (NodePort) ────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sani-app
  namespace: sani-lite
spec:
  type: NodePort
  selector:
    app: sani-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
---
# ── HorizontalPodAutoscaler ───────────────────────────────────────────────────
# Targets the sani-app Deployment.
# minReplicas: 2  → always at least 2 pods (high availability)
# maxReplicas: 6  → never more than 6 pods (cost control)
# CPU target 70%  → scale up when average CPU across all pods exceeds 70%
# Memory target 80% → scale up when average memory exceeds 80%
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sani-app
  namespace: sani-lite
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sani-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
