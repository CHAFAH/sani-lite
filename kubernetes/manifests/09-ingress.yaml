# ══════════════════════════════════════════════════════════════════════════════
# STEP 8 — Ingress
# ══════════════════════════════════════════════════════════════════════════════
# Ingress exposes HTTP/HTTPS routes from OUTSIDE the cluster to Services inside.
#
# Why Ingress instead of LoadBalancer Service (Step 4)?
#   LoadBalancer Service → 1 ELB per service = expensive, no path routing
#   Ingress              → 1 ALB for ALL services, path-based routing, SSL termination
#
# How it works:
#   Browser → ALB (created by AWS LB Controller) → Ingress rules → Service → Pods
#
# Requires the AWS Load Balancer Controller to be installed in the cluster.
# Install it once after cluster creation:
#
#   helm repo add eks https://aws.github.io/eks-charts
#   helm repo update
#   helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
#     -n kube-system \
#     --set clusterName=sani-lite-cluster-dev \
#     --set serviceAccount.create=true \
#     --set serviceAccount.name=aws-load-balancer-controller \
#     --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=<lb_controller_role_arn>
#
# Apply:   kubectl apply -f 09-ingress.yaml
# Check:   kubectl get ingress -n sani-lite
# URL:     kubectl get ingress sani-lite -n sani-lite \
#            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
#
# Note: ALB takes ~2 minutes to provision after applying.
# Cleanup: kubectl delete -f 09-ingress.yaml
# ══════════════════════════════════════════════════════════════════════════════

# ── MySQL Deployment ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: sani-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpassword
            - name: MYSQL_DATABASE
              value: sani
            - name: MYSQL_USER
              value: sani
            - name: MYSQL_PASSWORD
              value: sanipassword
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-u", "sani", "-psanipassword"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
# ── MySQL Service ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: sani-lite
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
# ── App Deployment ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sani-app
  namespace: sani-lite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sani-app
  template:
    metadata:
      labels:
        app: sani-app
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "Waiting for MySQL...";
                sleep 3;
              done
      containers:
        - name: sani-app
          image: 075120018043.dkr.ecr.us-east-1.amazonaws.com/sani-lite:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: mysql://sani:sanipassword@mysql:3306/sani
            - name: JWT_SECRET
              value: change-me-in-production
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
---
# ── App Service (ClusterIP) ───────────────────────────────────────────────────
# Ingress routes to this ClusterIP service — no NodePort needed
apiVersion: v1
kind: Service
metadata:
  name: sani-app
  namespace: sani-lite
spec:
  type: ClusterIP
  selector:
    app: sani-app
  ports:
    - port: 3000
      targetPort: 3000
---
# ── Ingress ───────────────────────────────────────────────────────────────────
# The AWS Load Balancer Controller reads this and provisions an ALB.
# Annotations control ALB behaviour:
#   scheme: internet-facing → public ALB (use internal for private)
#   target-type: ip         → routes directly to pod IPs (recommended)
#   listen-ports            → ALB listens on port 80
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sani-lite
  namespace: sani-lite
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sani-app
                port:
                  number: 3000
