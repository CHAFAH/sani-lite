# ── Ingress ───────────────────────────────────────────────────────────────────
# Ingress exposes HTTP/HTTPS routes from outside the cluster to Services inside.
# It requires an Ingress Controller — we use the AWS Load Balancer Controller
# which provisions an Application Load Balancer (ALB) automatically.
#
# Apply:  kubectl apply -f 09-ingress.yaml
# Check:  kubectl get ingress -n sani-lite
# URL:    kubectl get ingress sani-lite -n sani-lite -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sani-lite
  namespace: sani-lite
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sani-app
                port:
                  number: 3000
