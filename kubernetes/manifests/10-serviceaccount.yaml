# ── ServiceAccount ────────────────────────────────────────────────────────────
# A ServiceAccount gives pods an identity inside the cluster.
# Combined with IRSA (IAM Roles for Service Accounts), pods can call AWS APIs
# (S3, Secrets Manager, ECR) without storing AWS credentials in the pod.
#
# How IRSA works:
#   1. Terraform creates an IAM role with a trust policy for this service account
#   2. The annotation below links the pod identity to that IAM role
#   3. AWS SDK inside the pod automatically gets temporary credentials
#
# Apply:  kubectl apply -f 10-serviceaccount.yaml
# Check:  kubectl get serviceaccount app-sa -n sani-lite -o yaml

apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: sani-lite
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::075120018043:role/sani-lite-cluster-dev-app-sa"
