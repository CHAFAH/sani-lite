# ══════════════════════════════════════════════════════════════════════════════
# STEP 9 — ServiceAccount + IRSA
# ══════════════════════════════════════════════════════════════════════════════
# A ServiceAccount gives pods an IDENTITY inside the cluster.
# Every pod runs as a ServiceAccount — if you don't specify one, it uses "default".
#
# IRSA (IAM Roles for Service Accounts):
#   Combines a Kubernetes ServiceAccount with an AWS IAM Role.
#   The pod gets temporary AWS credentials automatically — no access keys needed.
#
# How IRSA works:
#   1. Terraform creates an IAM role with a trust policy scoped to this SA
#   2. The annotation eks.amazonaws.com/role-arn links the SA to that IAM role
#   3. EKS injects a projected token into the pod via a volume
#   4. The AWS SDK exchanges that token for temporary STS credentials
#   5. The pod can now call S3, Secrets Manager, ECR — with automatic rotation
#
# Apply:   kubectl apply -f 10-serviceaccount.yaml
# Check:   kubectl get serviceaccount app-sa -n sani-lite -o yaml
#
# Demo — verify the pod has AWS credentials:
#   kubectl exec -it <pod-name> -n sani-lite -- sh
#   env | grep AWS          ← shows AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE
#
# Access:  http://<NODE_PUBLIC_IP>:30300
# Cleanup: kubectl delete -f 10-serviceaccount.yaml
# ══════════════════════════════════════════════════════════════════════════════

# ── ServiceAccount ────────────────────────────────────────────────────────────
# The annotation is what enables IRSA — it links this SA to the IAM role
# that Terraform created (terraform output app_irsa_role_arn)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: sani-lite
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::211125430491:role/sani-lite-cluster-dev-app-sa"
---
# ── MySQL Deployment ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: sani-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpassword
            - name: MYSQL_DATABASE
              value: sani
            - name: MYSQL_USER
              value: sani
            - name: MYSQL_PASSWORD
              value: sanipassword
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-u", "sani", "-psanipassword"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
# ── MySQL Service ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: sani-lite
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
# ── App Deployment (using ServiceAccount) ────────────────────────────────────
# serviceAccountName: app-sa  ← this is the only change from previous steps
# The pod now has AWS credentials injected automatically via IRSA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sani-app
  namespace: sani-lite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sani-app
  template:
    metadata:
      labels:
        app: sani-app
    spec:
      serviceAccountName: app-sa
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "Waiting for MySQL...";
                sleep 3;
              done
      containers:
        - name: sani-app
          image: 211125430491.dkr.ecr.us-east-1.amazonaws.com/sani-lite:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: mysql://sani:sanipassword@mysql:3306/sani
            - name: JWT_SECRET
              value: change-me-in-production
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
---
# ── App Service (NodePort) ────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sani-app
  namespace: sani-lite
spec:
  type: NodePort
  selector:
    app: sani-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
