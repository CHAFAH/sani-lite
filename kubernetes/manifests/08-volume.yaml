# ══════════════════════════════════════════════════════════════════════════════
# STEP 7 — Persistent Volume
# ══════════════════════════════════════════════════════════════════════════════
# Containers are EPHEMERAL — all data inside a container is lost when it restarts.
# Without a volume, every MySQL restart wipes the entire database.
#
# Two objects:
#   PersistentVolume (PV)      — the actual storage (EBS volume on AWS)
#   PersistentVolumeClaim (PVC)— a pod's REQUEST for storage
#
# On EKS the EBS CSI driver handles dynamic provisioning:
#   You create a PVC → EKS automatically creates an EBS volume (PV) → mounts it
#
# storageClassName: gp2 → AWS EBS gp2 SSD
# accessModes: ReadWriteOnce → only one node can mount this at a time (fine for MySQL)
#
# Apply:    kubectl apply -f 08-volume.yaml
# Check PVC: kubectl get pvc -n sani-lite
# Check PV:  kubectl get pv
#
# Demo — prove data persists across pod restarts:
#   1. kubectl exec -it <mysql-pod> -n sani-lite -- bash
#      mysql -u sani -psanipassword sani
#      INSERT INTO some_table VALUES (...);
#      exit
#   2. kubectl delete pod <mysql-pod> -n sani-lite   (deployment recreates it)
#   3. kubectl exec -it <new-mysql-pod> -n sani-lite -- bash
#      mysql -u sani -psanipassword sani
#      SELECT * FROM some_table;   ← data is still there!
#
# Access:   http://<NODE_PUBLIC_IP>:30300
# Cleanup:  kubectl delete -f 08-volume.yaml
# ══════════════════════════════════════════════════════════════════════════════

# ── PersistentVolumeClaim ─────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: sani-lite
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: gp2
---
# ── MySQL Deployment (with PVC mounted) ───────────────────────────────────────
# The volumeMounts + volumes section is what connects the PVC to the container.
# /var/lib/mysql is where MySQL stores all its data files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: sani-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpassword
            - name: MYSQL_DATABASE
              value: sani
            - name: MYSQL_USER
              value: sani
            - name: MYSQL_PASSWORD
              value: sanipassword
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-u", "sani", "-psanipassword"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-u", "sani", "-psanipassword"]
            initialDelaySeconds: 30
            periodSeconds: 10
          # Mount the PVC into the container at the MySQL data directory
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      # Reference the PVC by name
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
---
# ── MySQL Service ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: sani-lite
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
# ── App Deployment ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sani-app
  namespace: sani-lite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sani-app
  template:
    metadata:
      labels:
        app: sani-app
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "Waiting for MySQL...";
                sleep 3;
              done
      containers:
        - name: sani-app
          image: 075120018043.dkr.ecr.us-east-1.amazonaws.com/sani-lite:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: mysql://sani:sanipassword@mysql:3306/sani
            - name: JWT_SECRET
              value: change-me-in-production
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
---
# ── App Service (NodePort) ────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sani-app
  namespace: sani-lite
spec:
  type: NodePort
  selector:
    app: sani-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
