# ══════════════════════════════════════════════════════════════════════════════
# STEP 6 — Secret
# ══════════════════════════════════════════════════════════════════════════════
# A Secret stores SENSITIVE data (passwords, tokens, API keys).
# Values are base64-encoded — NOT encrypted.
# Anyone with kubectl access can decode them.
#
# Base64 is just encoding:
#   Encode: echo -n "my-password" | base64
#   Decode: echo -n "bXktcGFzc3dvcmQ=" | base64 --decode
#
# In PRODUCTION use ExternalSecret + AWS Secrets Manager (Step 11).
#
# Two ways to consume a Secret in a pod:
#   1. secretKeyRef  — reference individual keys by name
#   2. envFrom       — load ALL keys as env vars at once
#
# Apply:    kubectl apply -f 07-secret.yaml
# Check:    kubectl get secret app-secrets -n sani-lite
# Decode:   kubectl get secret app-secrets -n sani-lite \
#             -o jsonpath='{.data.DATABASE_URL}' | base64 --decode
#
# Demo — verify env vars inside the running pod:
#   kubectl exec -it <pod-name> -n sani-lite -- sh
#   echo $DATABASE_URL
#   echo $JWT_SECRET
#
# Access:   http://<NODE_PUBLIC_IP>:30300
# Cleanup:  kubectl delete -f 07-secret.yaml
# ══════════════════════════════════════════════════════════════════════════════

# ── Secret ────────────────────────────────────────────────────────────────────
# DATABASE_URL = mysql://sani:sanipassword@mysql:3306/sani
# JWT_SECRET   = change-me-in-production
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: sani-lite
type: Opaque
data:
  DATABASE_URL: bXlzcWw6Ly9zYW5pOnNhbmlwYXNzd29yZEBteXNxbDozMzA2L3Nhbmk=
  JWT_SECRET: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=
---
# ── MySQL Deployment ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: sani-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpassword
            - name: MYSQL_DATABASE
              value: sani
            - name: MYSQL_USER
              value: sani
            - name: MYSQL_PASSWORD
              value: sanipassword
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-u", "sani", "-psanipassword"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
# ── MySQL Service ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: sani-lite
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
# ── App Deployment (consuming Secret) ────────────────────────────────────────
# Shows BOTH ways to use a Secret:
#   METHOD 1 — secretKeyRef: reference a specific key by name
#   METHOD 2 — envFrom secretRef: load ALL secret keys as env vars at once
#
# Here we use METHOD 1 for DATABASE_URL and JWT_SECRET (explicit, clear intent)
# and METHOD 2 is shown commented out below for comparison.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sani-app
  namespace: sani-lite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sani-app
  template:
    metadata:
      labels:
        app: sani-app
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "Waiting for MySQL...";
                sleep 3;
              done
      containers:
        - name: sani-app
          image: 211125430491.dkr.ecr.us-east-1.amazonaws.com/sani-lite:latest
          ports:
            - containerPort: 3000
          env:
            # METHOD 1 — secretKeyRef (reference individual keys)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            # Non-sensitive config still hardcoded here
            # (in Step 5 we moved these to ConfigMap)
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          # METHOD 2 — envFrom (load ALL secret keys at once, commented for comparison)
          # envFrom:
          #   - secretRef:
          #       name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
---
# ── App Service (NodePort) ────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sani-app
  namespace: sani-lite
spec:
  type: NodePort
  selector:
    app: sani-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
