# ── Secret ────────────────────────────────────────────────────────────────────
# Secret stores sensitive data (passwords, tokens, keys) as base64-encoded values.
# Base64 is NOT encryption — use External Secrets Operator (ESO) with
# AWS Secrets Manager in production (see 12-externalsecret.yaml).
#
# Encode:  echo -n "your-value" | base64
# Decode:  echo -n "encoded" | base64 --decode
#
# Apply:   kubectl apply -f 07-secret.yaml
# Decode:  kubectl get secret app-secrets -n sani-lite \
#            -o jsonpath='{.data.DATABASE_URL}' | base64 --decode
#
# Current values:
#   DATABASE_URL = mysql://sani:sanipassword@mysql:3306/sani
#   JWT_SECRET   = change-me-in-production

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: sani-lite
type: Opaque
data:
  DATABASE_URL: bXlzcWw6Ly9zYW5pOnNhbmlwYXNzd29yZEBteXNxbDozMzA2L3Nhbmk=
  JWT_SECRET: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=
