# ══════════════════════════════════════════════════════════════════════════════
# STEP 3 — Deployment
# ══════════════════════════════════════════════════════════════════════════════
# A Deployment wraps a ReplicaSet and adds:
#   ✔ Rolling updates  — new pods come up before old ones go down (zero downtime)
#   ✔ Rollback         — instantly revert to a previous version
#   ✔ Revision history — full audit trail of every change
#
# Difference from ReplicaSet (Step 2):
#   ReplicaSet → self-healing only, no rolling updates
#   Deployment → self-healing + rolling updates + rollback
#
# This is what you use in PRODUCTION — not bare Pods or ReplicaSets.
#
# Apply:    kubectl apply -f 04-deployment.yaml
# Check:    kubectl get deployments -n sani-lite
# Status:   kubectl rollout status deployment/sani-app -n sani-lite
# History:  kubectl rollout history deployment/sani-app -n sani-lite
# Rollback: kubectl rollout undo deployment/sani-app -n sani-lite
#
# Demo — rolling update:
#   kubectl set image deployment/sani-app \
#     sani-app=211125430491.dkr.ecr.us-east-1.amazonaws.com/sani-lite:new-tag \
#     -n sani-lite
#   kubectl rollout status deployment/sani-app -n sani-lite
#
# Demo — rollback:
#   kubectl rollout undo deployment/sani-app -n sani-lite
#
# Access:   http://<NODE_PUBLIC_IP>:30300
# Cleanup:  kubectl delete -f 04-deployment.yaml
# ══════════════════════════════════════════════════════════════════════════════

# ── MySQL Deployment ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: sani-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpassword
            - name: MYSQL_DATABASE
              value: sani
            - name: MYSQL_USER
              value: sani
            - name: MYSQL_PASSWORD
              value: sanipassword
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-u", "sani", "-psanipassword"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-u", "sani", "-psanipassword"]
            initialDelaySeconds: 30
            periodSeconds: 10
---
# ── MySQL Service (ClusterIP) ─────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: sani-lite
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
# ── App Deployment ────────────────────────────────────────────────────────────
# Note: env vars are hardcoded here (no ConfigMap/Secret yet).
# In Step 5 (ConfigMap) and Step 6 (Secret) we will move these out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sani-app
  namespace: sani-lite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sani-app
  template:
    metadata:
      labels:
        app: sani-app
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "Waiting for MySQL...";
                sleep 3;
              done
      containers:
        - name: sani-app
          image: 211125430491.dkr.ecr.us-east-1.amazonaws.com/sani-lite:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: mysql://sani:sanipassword@mysql:3306/sani
            - name: JWT_SECRET
              value: change-me-in-production
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
---
# ── App Service (NodePort) ────────────────────────────────────────────────────
# Access: http://<NODE_PUBLIC_IP>:30300
apiVersion: v1
kind: Service
metadata:
  name: sani-app
  namespace: sani-lite
spec:
  type: NodePort
  selector:
    app: sani-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
